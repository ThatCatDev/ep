name: go-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.24.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # setup-go must be v3+ to actually honour go-version. On v2 it silently
      # fell back to whatever Go the runner image ships, which is how the
      # linter ended up typechecking a 1.26 stdlib it was too old to parse.
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mocks
        run: make generate

      - name: Setup go modules
        run: go mod download; go mod verify;

      # Pinned rather than "latest": the resolved version has to be built with
      # a Go at least as new as the toolchain above, and letting it drift is
      # what silently broke this job.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m --modules-download-mode=readonly

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mocks
        run: make generate

      # Everything not behind an integration_* build tag. Needs no broker, so
      # a sick container cannot take this job down with it.
      - name: Run unit tests
        run: go test -v -race ./...

  integration:
    name: integration (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      # One broker being unhealthy should not hide the other drivers' results.
      fail-fast: false
      matrix:
        include:
          - driver: kafka
            services: broker
          - driver: nats
            services: nats
          - driver: pulsar
            services: pulsar
    steps:
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mocks
        run: make generate

      # Only this driver's broker, rather than every service in the compose
      # file. Ports are published to the host, so the runner reaches them on
      # localhost without needing a container to test from.
      - name: Start ${{ matrix.services }}
        run: docker compose up -d --wait ${{ matrix.services }}

      - name: Run ${{ matrix.driver }} integration tests
        run: go test -v -tags integration_${{ matrix.driver }} ./...

      - name: Broker logs on failure
        if: failure()
        run: docker compose logs ${{ matrix.services }}

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [ lint, unit, integration ]
    steps:
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release
        uses: cycjimmy/semantic-release-action@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 18
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.2
            @semantic-release/changelog@6.0.1
