name: go-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: go-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ "1.24.x" ]
    steps:
      # setup-go must be v3+ to actually honour go-version. On v2 it silently
      # fell back to whatever Go the runner image ships, which is how the
      # linter ended up typechecking a 1.26 stdlib it was too old to parse.
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: mocks
        run: make generate

      - name: Setup go modules
        run: go clean -modcache;go mod tidy; go mod download; go mod verify;

      # Pinned rather than "latest": the resolved version has to be built with
      # a Go at least as new as the toolchain above, and letting it drift is
      # what silently broke this job.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m --modules-download-mode=readonly
          # v6 added a strict schema check of .golangci.json that v2 did not
          # run, and the config fails it on three counts. That file is synced
          # from honestbank/.github and marked do-not-modify, so skip the
          # check rather than edit it. `golangci-lint run` itself only warns.
          verify: false

      - uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          # Description: Path to compose file(s). It can be a list of files. It can be
          # absolute or relative to the current working directory (cwd).
          #
          # Default: ./docker-compose.yml
          compose-file: docker-compose.yaml
       # run tests in golang docker container
      - name: Run tests
        # EP_INTEGRATION=1 makes an unreachable broker a failure rather than a
        # skip, so CI cannot go green on integration tests that never ran.
        run:  docker run --network=host -e EP_INTEGRATION=1 -v $(pwd):/app -w /app golang:1.24 bash -c "go test -v ./..."
  #      - name: Test and generate code coverage
#        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release
        uses: cycjimmy/semantic-release-action@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 18
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.2
            @semantic-release/changelog@6.0.1